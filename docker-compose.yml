# Lancement (ELM327 USB, contact mis) :
#   OBD_GID=$(stat -c %g /dev/ttyUSB0) docker compose up --build      puis  https://127.0.0.1:8080
# OBD_GID : groupe propriétaire du port série sur l'hôte.
#   Arch : uucp · Debian / Ubuntu / WSL : dialout (20, par défaut).
# OBD_DEVICE=/dev/ttyACM0 si la clé n'apparaît pas en ttyUSB0.
# Autres options du script : CLIO_ARGS="--port /dev/ttyUSB0 --log logs/trajet.csv --fast" docker compose up
services:
  clio:
    build: .
    image: dashboard-clio
    command: ${CLIO_ARGS:---port /dev/ttyUSB0}
    # Tourne sous ton utilisateur (Linux) : certs/, logs/ et data/ restent à toi, pas à root
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # 127.0.0.1 uniquement : la page n'est pas exposée au réseau.
      - "127.0.0.1:8080:8080"
    devices:
      - "${OBD_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0"
    group_add:
      - "${OBD_GID:-20}"
    volumes:
      - ./certs:/app/certs   # certificat gardé entre deux lancements (à approuver une fois dans Windows)
      - ./logs:/app/logs     # CSV : CLIO_ARGS="--port /dev/ttyUSB0 --log logs/trajet.csv"
      - ./data:/app/data     # base SQLite des mesures horodatées
    restart: unless-stopped
