# Lancement (Linux, ELM327 USB) :
#   OBD_GID=$(stat -c %g /dev/ttyUSB0) docker compose up --build      puis  https://127.0.0.1:8080
# Windows (PowerShell), ELM327 Wi-Fi ou USB : voir la section « Docker sous Windows » du README.
#
# Variables (toutes facultatives) :
#   CLIO_ARGS     options du script (défaut : --port /hostdev/ttyUSB0 ; Wi-Fi : --port socket://IP:35000 --baud 38400)
#   OBD_GID       groupe du port série sur l'hôte (Arch : uucp ; défaut 20 = dialout, Debian / Ubuntu / WSL)
#   CLIO_DATA     où ranger la base : dossier ./data (défaut) ou volume Docker clio-data (conseillé sous Windows)
#   CLIO_VERSION  version enregistrée avec chaque session (l'image n'a pas le dossier .git)
#   TZ            fuseau horaire des noms de trajets (défaut Europe/Paris)
#   CLIO_PORT     port de la page sur l'hôte (défaut 8080), si 8080 est déjà pris
#   CLIO_HOST     0.0.0.0 : page accessible depuis les autres PC du réseau (défaut 127.0.0.1 : ce PC seulement)
#   CLIO_SERVER   envoi vers clio-sentinel-server, ex. http://192.168.1.13:8207,http://10.100.0.1:8207 (README, « Serveur »)
#   CLIO_SERVER_NAME  nom de ce PC sur la page du serveur (défaut : nom du conteneur, peu parlant)
services:
  clio:
    build: .
    image: dashboard-clio
    command: ${CLIO_ARGS:---port /hostdev/ttyUSB0}
    # Tourne sous ton utilisateur (Linux) : certs/, logs/ et data/ restent à toi, pas à root
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # 127.0.0.1 par défaut : la page n'est pas exposée au réseau (pas de mot de passe sur le dashboard).
      - "${CLIO_HOST:-127.0.0.1}:${CLIO_PORT:-8080}:8080"
    volumes:
      # /dev de l'hôte en lecture seule : le conteneur démarre sans la clé et la voit quand on la branche.
      # Seuls les ports série USB sont autorisés (règles ci-dessous) : disques et autres périphériques restent bloqués.
      - /dev:/hostdev:ro
      - ./certs:/app/certs   # certificat gardé entre deux lancements (à approuver une fois dans Windows)
      - ./logs:/app/logs     # CSV : CLIO_ARGS="--port /hostdev/ttyUSB0 --log logs/trajet.csv"
      - ${CLIO_DATA:-./data}:/app/data   # base SQLite des mesures
    device_cgroup_rules:
      - "c 188:* rmw"        # /dev/ttyUSB* (CH340, FTDI, CP210x…)
      - "c 166:* rmw"        # /dev/ttyACM*
    extra_hosts:
      - "host.docker.internal:host-gateway"   # serveur clio-sentinel-server sur cette même machine (Linux)
    group_add:
      - "${OBD_GID:-20}"
    environment:
      TZ: ${TZ:-Europe/Paris}
      CLIO_VERSION: ${CLIO_VERSION:-}
      CLIO_SERVER: ${CLIO_SERVER:-}
      CLIO_SERVER_NAME: ${CLIO_SERVER_NAME:-clio-docker}
    restart: unless-stopped

volumes:
  clio-data:                 # utilisé seulement avec CLIO_DATA=clio-data
