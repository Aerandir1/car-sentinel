# ELM327 USB transmis au conteneur (Windows : après « usbipd attach --wsl », voir README).
#   docker compose -f docker-compose.yml -f docker-compose.obd.yml up --build
services:
  clio:
    command: ${CLIO_ARGS:---port /dev/ttyUSB0 --log logs/trajet.csv}
    devices:
      - "${OBD_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0"
