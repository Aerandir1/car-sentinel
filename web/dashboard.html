<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clio 4 dCi 90</title>
<style>
  :root {
    --bg: #0d1014; --panel: #161b22; --line: #262d36; --text: #e6edf3; --dim: #8b949e;
    --accent: #f0b429; --hot: #f85149; --cold: #58a6ff; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); }
  /* Logos Renault (dossier logo/) : utilisés en masque, ils prennent la couleur du texte (currentColor) */
  .r-mark, .r-lockup { display: inline-block; flex: none; background: currentColor;
                       -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }
  .r-mark { --src: url(/logo/Renault_2021_Logo.svg); aspect-ratio: 1000 / 1307; }
  .r-lockup { --src: url(/logo/Renault_2021_Text.svg); aspect-ratio: 500 / 437.5; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .r-mark { height: 26px; color: var(--text); }
  #status { color: var(--dim); font-size: 13px; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav button.on { border-color: var(--accent); color: var(--accent); }
  header button { background: var(--panel); color: var(--text);
                  border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  main { padding: 16px; display: grid; gap: 16px; }
  .gauges { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  canvas { display: block; width: 100%; }
  #tach { aspect-ratio: 2 / 1.15; }
  #boostg { aspect-ratio: 1 / 1.15; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
          transition: border-color .2s, background .2s; display: block; width: 100%; text-align: left;
          color: inherit; font: inherit; cursor: pointer; }
  .tile:hover { border-color: #3a434f; }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .spark { height: 34px; margin: 4px 0 2px; }
  .tile .lbl { color: var(--dim); font-size: 12px; }
  .tile .val { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .val small { font-size: 13px; color: var(--dim); font-weight: 400; margin-left: 4px; }
  .tile .mm { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .tile.hot { border-color: var(--hot); background: #2a1215; }
  .tile.hot .val { color: var(--hot); }
  .tile.cold .val { color: var(--cold); }

  /* Courbe détaillée d'une métrique (clic sur une tuile) */
  dialog#detail { width: min(1100px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 16px 20px;
                  background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; }
  dialog#detail::backdrop { background: rgba(5, 7, 10, .7); }
  .d-head { display: flex; align-items: flex-start; gap: 16px; }
  .d-head h2 { font-size: 15px; font-weight: 600; margin: 0; color: var(--dim); }
  .d-now { font-size: 30px; font-weight: 600; }
  .d-now small { font-size: 14px; color: var(--dim); font-weight: 400; margin-left: 4px; }
  .d-close { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--text); border-radius: 6px;
             width: 32px; height: 32px; cursor: pointer; font-size: 16px; }
  .d-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { background: none; border: 0; color: var(--dim); padding: 6px 12px; cursor: pointer; font: inherit; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: #222a33; color: var(--text); }
  .d-filters select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
                      padding: 6px 8px; font: inherit; }
  .d-plot { position: relative; }
  #d-chart { height: min(420px, 55vh); touch-action: none; }
  #d-chart.loading { opacity: .5; }
  .tip { position: absolute; pointer-events: none; background: var(--bg); border: 1px solid var(--line);
         border-radius: 6px; padding: 6px 10px; white-space: nowrap; display: none; }
  .tip b { display: block; font-size: 15px; }
  .tip span { color: var(--dim); font-size: 12px; }
  .d-info { color: var(--dim); font-size: 12px; margin: 6px 0 0; min-height: 1.4em; }
  [hidden] { display: none !important; }
  #settings { max-width: 720px; }
  #settings h2 { font-size: 14px; margin: 0 0 4px; }
  #settings .note { color: var(--dim); font-size: 12px; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 1fr 180px 70px; gap: 12px; align-items: center;
         padding: 10px 0; border-top: 1px solid var(--line); }
  .row label { display: block; }
  .row label small { display: block; color: var(--dim); font-size: 12px; }
  .row input { width: 100%; accent-color: var(--accent); }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  #saved { color: var(--ok); font-size: 12px; margin-left: 8px; opacity: 0; transition: opacity .3s; }
  footer { padding: 0 16px 16px; color: var(--dim); font-size: 12px; }

  /* Onglet Trajets */
  #trips { display: grid; gap: 12px; max-width: 900px; }
  #trips .empty { color: var(--dim); }
  .trip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
          display: grid; gap: 6px; }
  .trip.live { border-color: var(--ok); }
  .trip.idle { opacity: .75; }
  .t-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  .t-head b { font-size: 15px; }
  .badge { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--dim); }
  .badge.live { border-color: var(--ok); color: var(--ok); }
  .t-facts, .t-max { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .t-facts b { color: var(--text); font-weight: 600; }
  .t-alerts { color: var(--hot); font-size: 13px; margin: 0; padding-left: 18px; }
  .t-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .t-note { flex: 1 1 240px; background: var(--bg); color: var(--text); border: 1px solid var(--line);
            border-radius: 6px; padding: 6px 8px; font: inherit; }
  .t-actions button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
                      padding: 6px 12px; cursor: pointer; font: inherit; }
  .t-saved { color: var(--ok); font-size: 12px; opacity: 0; transition: opacity .3s; }
  @media (max-width: 700px) {
    .gauges { grid-template-columns: 1fr; }
    header { flex-wrap: wrap; }
    .row { grid-template-columns: 1fr 70px; }
    .row input { grid-column: 1 / -1; grid-row: 2; }
  }
</style>
</head>
<body>
<header>
  <span class="r-mark" role="img" aria-label="Renault"></span>
  <div id="dot"></div>
  <h1>Clio 4 dCi 90 · OBD</h1>
  <span id="status">chargement…</span>
  <nav>
    <button id="tab-dash" class="on">Tableau de bord</button>
    <button id="tab-trips">Trajets</button>
    <button id="tab-set">Paramètres</button>
    <button id="reset">Réinit. min/max</button>
  </nav>
</header>
<main id="view-dash">
  <section class="gauges">
    <div class="panel"><canvas id="tach"></canvas></div>
    <div class="panel"><canvas id="boostg"></canvas></div>
  </section>
  <section class="tiles" id="tiles"></section>
</main>
<dialog id="detail" aria-labelledby="d-title">
  <div class="d-head">
    <div>
      <h2 id="d-title"></h2>
      <div class="d-now" id="d-now"></div>
    </div>
    <button class="d-close" id="d-close" aria-label="Fermer">✕</button>
  </div>
  <div class="d-filters">
    <div class="seg" id="d-range">
      <button data-s="60">1 min</button>
      <button data-s="300">5 min</button>
      <button data-s="900">15 min</button>
      <button data-s="0">Trajet entier</button>
    </div>
    <select id="d-trip" aria-label="Trajet"></select>
  </div>
  <div class="d-plot">
    <canvas id="d-chart"></canvas>
    <div class="tip" id="d-tip"><b></b><span></span></div>
  </div>
  <p class="d-info" id="d-info"></p>
</dialog>
<main id="view-trips" hidden>
  <section id="trips"><p class="empty">Chargement…</p></section>
</main>
<main id="view-set" hidden>
  <section class="panel" id="settings">
    <h2>Affichage</h2>
    <p class="note">Propre à ce navigateur.</p>
    <div class="row">
      <label for="s-poll">Rafraîchissement de la page<small>Fréquence de lecture des valeurs</small></label>
      <input type="range" id="s-poll" min="50" max="2000" step="50">
      <output id="o-poll"></output>
    </div>
    <div class="row">
      <label for="s-hist">Durée des mini-courbes<small>Période affichée dans chaque tuile</small></label>
      <input type="range" id="s-hist" min="10" max="300" step="10">
      <output id="o-hist"></output>
    </div>
    <h2 style="margin-top:20px">Acquisition <span id="saved">enregistré</span></h2>
    <p class="note">Appliqué tout de suite par le script Python, jusqu'à son arrêt.</p>
    <div class="row">
      <label for="s-max_hz">Fréquence max d'acquisition<small>Boucle de lecture de l'ECU</small></label>
      <input type="range" id="s-max_hz" min="0.5" max="50" step="0.5">
      <output id="o-max_hz"></output>
    </div>
    <div class="row">
      <label for="s-delay">Pause entre requêtes OBD<small>À augmenter si l'ELM327 décroche</small></label>
      <input type="range" id="s-delay" min="0" max="1" step="0.01">
      <output id="o-delay"></output>
    </div>
    <div class="row">
      <label for="s-fast">Mode rapide (fast)<small>Requêtes OBD plus courtes. Reconnecte l'ELM327</small></label>
      <input type="checkbox" id="s-fast" style="width:auto;justify-self:start">
      <output id="o-fast"></output>
    </div>
    <div class="row">
      <label for="s-log_hz">Fréquence du CSV<small>Seulement si le script tourne avec --log</small></label>
      <input type="range" id="s-log_hz" min="0.2" max="50" step="0.2">
      <output id="o-log_hz"></output>
    </div>
    <div class="row" style="grid-template-columns:1fr auto">
      <span class="note" style="margin:0">Valeurs de départ : 200 ms et 120 s pour l'affichage.</span>
      <button id="s-default">Affichage par défaut</button>
    </div>
  </section>
</main>
<footer id="foot"></footer>

<script>
// Réglages d'affichage, gardés dans le navigateur
const DEFAULTS = { poll_ms: 200, history_s: 120 };
const ui = { ...DEFAULTS };
try { Object.assign(ui, JSON.parse(localStorage.getItem("clio-ui") || "{}")); } catch (e) {}
const saveUi = () => { try { localStorage.setItem("clio-ui", JSON.stringify(ui)); } catch (e) {} };
// Presque constantes sur un trajet : pas de mini-courbe (la courbe détaillée reste dispo au clic)
const NO_SPARK = new Set(["baro", "ambient"]);
let meta = null, last = null;
const series = {};   // clé → [[t_ms, valeur], …] des history_s dernières secondes (mini-courbes)

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function fmt(v, unit) {
  if (v === null || v === undefined) return "—";
  if (Math.abs(v) < 0.005) v = 0;
  if (unit === "bar" || unit === "V") return v.toFixed(2);
  if (unit === "tr/min") return Math.round(v).toString();
  return Math.abs(v) < 10 ? v.toFixed(1) : Math.round(v).toString();
}

function buildTiles() {
  $("tiles").innerHTML = meta.metrics.map((m) => `
    <button class="tile" id="t-${m.key}" data-key="${m.key}" title="Voir la courbe">
      <div class="lbl">${m.label}</div>
      <div class="val"><span>—</span><small>${m.unit}</small></div>
      ${NO_SPARK.has(m.key) ? "" : '<canvas class="spark"></canvas>'}
      <div class="mm">min — · max —</div>
    </button>`).join("");
  for (const el of document.querySelectorAll(".tile")) el.onclick = () => openDetail(el.dataset.key);
  seedSeries();
  $("foot").textContent = meta.unsupported.length
    ? "Non supporté par le calculateur : " + meta.unsupported.join(", ")
    : "";
}

function updateTiles(s) {
  for (const m of meta.metrics) {
    const el = $("t-" + m.key);
    const v = s.values[m.key];
    el.querySelector(".val span").textContent = fmt(v, m.unit);
    el.querySelector(".mm").textContent = `min ${fmt(s.min[m.key], m.unit)} · max ${fmt(s.max[m.key], m.unit)}`;
    el.classList.toggle("hot", m.warn !== null && v != null && v > m.warn);
    el.classList.toggle("cold", m.cold !== null && v != null && v < m.cold);
    const c = el.querySelector(".spark");
    if (c) drawSpark(c, m);
  }
}

// Mini-courbes : historique récent pris dans la base au chargement, puis complété à chaque lecture
function pushPoint(key, t, v) {
  const arr = (series[key] ||= []);
  if (arr.length && arr[arr.length - 1][0] >= t) return;   // valeur déjà vue (même horodatage)
  arr.push([t, v]);
  const oldest = t - ui.history_s * 1000;
  while (arr.length && arr[0][0] < oldest) arr.shift();
}
async function seedSeries() {
  const from = Date.now() - ui.history_s * 1000;
  await Promise.all(meta.metrics.filter((m) => !NO_SPARK.has(m.key)).map(async (m) => {
    try {
      const h = await (await fetch(`/api/history?key=${m.key}&from=${from}`)).json();
      const live = series[m.key] || [];
      series[m.key] = h.points.filter((p) => !live.length || p[0] < live[0][0]).concat(live);
    } catch (e) {}   // pas de base (--no-db) : les mini-courbes partent de l'ouverture de la page
  }));
}

// Coupe la courbe sur une valeur manquante ou un trou de plus de gap_ms (calculateur muet, déconnexion)
function tracePath(ctx, pts, x, y, gap_ms) {
  ctx.beginPath();
  let prevT = null;
  for (const [t, v] of pts) {
    if (v == null) { prevT = null; continue; }
    if (prevT == null || t - prevT > gap_ms) ctx.moveTo(x(t), y(v)); else ctx.lineTo(x(t), y(v));
    prevT = t;
  }
}

// Échelle verticale : min/max des données, au moins 5 % de la plage normale de la métrique
// (sinon le bruit d'une tension stable à 14,2 V remplirait toute la hauteur)
function yDomain(pts, m) {
  let lo = Infinity, hi = -Infinity;
  for (const [, v] of pts) if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (lo === Infinity) return null;
  const minSpan = (m.range[1] - m.range[0]) * 0.05;
  if (hi - lo < minSpan) { const mid = (hi + lo) / 2; lo = mid - minSpan / 2; hi = mid + minSpan / 2; }
  return [lo, hi];
}

function drawSpark(canvas, m) {
  const [ctx, w, h] = setupCanvas(canvas);
  const pts = series[m.key] || [];
  const dom = yDomain(pts, m);
  if (!dom) return;
  const now = Date.now(), span = ui.history_s * 1000;
  const x = (t) => w - ((now - t) / span) * w;
  const y = (v) => 3 + (h - 6) * (1 - (v - dom[0]) / (dom[1] - dom[0]));
  ctx.lineWidth = 1.5; ctx.lineJoin = ctx.lineCap = "round";
  ctx.strokeStyle = css("--accent");
  tracePath(ctx, pts, x, y, 5000);
  ctx.stroke();
}

function setupCanvas(c) {
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (c.width !== Math.round(r.width * dpr) || c.height !== Math.round(r.height * dpr)) {
    c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  }
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  return [ctx, r.width, r.height];
}

// Jauge en arc de 225° ; redline = début de la zone rouge
function drawGauge(canvas, { value, min, max, redline, ticks, tickLabel, big, small, unit }) {
  const [ctx, w, h] = setupCanvas(canvas);
  const cx = w / 2, cy = h * 0.55, R = Math.min(w / 2, h * 0.55) * 0.9;
  const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
  const ang = (v) => a0 + (a1 - a0) * (Math.min(max, Math.max(min, v)) - min) / (max - min);

  ctx.lineCap = "round";
  ctx.lineWidth = R * 0.09;
  ctx.strokeStyle = css("--line");
  ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.stroke();
  if (redline !== null) {
    ctx.strokeStyle = "#5c1d1d";
    ctx.beginPath(); ctx.arc(cx, cy, R, ang(redline), a1); ctx.stroke();
  }
  if (value !== null && value !== undefined) {
    ctx.strokeStyle = redline !== null && value >= redline ? css("--hot") : css("--accent");
    ctx.beginPath(); ctx.arc(cx, cy, R, a0, Math.max(a0 + 0.001, ang(value))); ctx.stroke();
  }

  ctx.fillStyle = css("--dim");
  ctx.font = `${Math.max(10, R * 0.09)}px system-ui`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const t of ticks) {
    const a = ang(t);
    ctx.fillText(tickLabel(t), cx + Math.cos(a) * R * 0.78, cy + Math.sin(a) * R * 0.78);
  }

  ctx.fillStyle = css("--text");
  ctx.font = `600 ${R * 0.36}px system-ui`;
  ctx.fillText(big, cx, cy - R * 0.02);
  ctx.fillStyle = css("--dim");
  ctx.font = `${R * 0.11}px system-ui`;
  ctx.fillText(unit, cx, cy + R * 0.24);
  if (small) {
    ctx.font = `${R * 0.13}px system-ui`;
    ctx.fillText(small, cx, cy + R * 0.62);
  }
}

function drawGauges(s) {
  const v = s ? s.values : {};
  drawGauge($("tach"), {
    value: v.rpm, min: 0, max: 5000, redline: 4500,
    ticks: [0, 1000, 2000, 3000, 4000, 5000], tickLabel: (t) => t / 1000,
    big: v.speed != null ? Math.round(v.speed) : "—", unit: "km/h",
    small: v.rpm != null ? `${Math.round(v.rpm)} tr/min` : "",
  });
  drawGauge($("boostg"), {
    value: v.boost, min: -0.2, max: 1.6, redline: 1.35,
    ticks: [0, 0.4, 0.8, 1.2, 1.6], tickLabel: (t) => t,
    big: fmt(v.boost, "bar"), unit: "bar (turbo)",
    small: s && s.max.boost != null ? `max ${s.max.boost.toFixed(2)}` : "",
  });
}

async function poll() {
  try {
    const s = await (await fetch("/api/state")).json();
    if (!meta || meta.metrics.length === 0 || s.status !== (last && last.status)) {
      meta = await (await fetch("/api/meta")).json();
      buildTiles();
    }
    last = s;
    for (const [k, v] of Object.entries(s.values)) if (s.ts[k]) pushPoint(k, s.ts[k], v);
    const live = s.status.startsWith("connecté");
    $("dot").style.background = live ? css("--ok") : css("--hot");
    // Synchro vers clio-sentinel-server (--server) : dernier essai, envoyé ou non
    const sync = !s.sync ? "" : s.sync.ok ? " · serveur à jour" : " · serveur injoignable";
    $("status").textContent = `${s.status} · ${meta.source} · ${s.hz} Hz${sync}`;
    $("status").title = s.sync?.error || "";
    updateTiles(s);
  } catch (e) {
    $("dot").style.background = css("--hot");
    $("status").textContent = "script Python injoignable";
  }
}

function frame() { drawGauges(last); requestAnimationFrame(frame); }

$("reset").onclick = () => fetch("/api/reset", { method: "POST" });

// ---------- Courbe détaillée (clic sur une tuile) ----------
const D = { key: null, m: null, range_s: 300, trip: null, pts: [], step: null, x0: 0, x1: 0, hover: null, timer: null };
const dlg = $("detail");

// Graduations « rondes » : pas de 1, 2 ou 5 × 10^n, environ n graduations
function niceTicks(lo, hi, n = 5) {
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 5, 10].map((k) => k * mag).find((k) => k >= raw);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;   // l'axe s'arrête sur des graduations
  const ticks = [];
  for (let v = lo; v <= hi + step * 1e-9; v += step) ticks.push(+v.toFixed(10));
  return { ticks, lo, hi };
}
const TIME_STEPS = [5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200].map((s) => s * 1000);
const hhmm = (t, sec) => new Date(t).toLocaleTimeString("fr-FR", sec ? {} : { hour: "2-digit", minute: "2-digit" });
const duree = (ms) => ms < 60000 ? `${Math.round(ms / 1000)} s`
  : ms < 3600000 ? `${Math.round(ms / 60000)} min` : `${Math.floor(ms / 3600000)} h ${String(Math.round(ms % 3600000 / 60000)).padStart(2, "0")}`;

async function loadTrips() {
  const sel = $("d-trip");
  try {
    const trips = await (await fetch("/api/trips")).json();
    sel.replaceChildren(...trips.map((t) => {
      const o = document.createElement("option");
      o.value = t.id;
      o.textContent = (t.id === last?.trip ? "En cours · " : "") + `${t.name} · ${duree(t.end_ms - t.start_ms)}`
        + (t.kind === "trajet" ? ` · ${fmtKm(t.distance_km)}` : "") + (t.note ? ` · ${t.note}` : "");
      return o;
    }));
    sel.hidden = !trips.length;
  } catch (e) { sel.hidden = true; }   // pas de base
  if (D.trip == null) D.trip = last?.trip ?? (sel.options[0] ? sel.options[0].value : null);
  sel.value = D.trip;
}

const isLive = () => D.trip == null || D.trip === last?.trip;

async function loadDetail() {
  const live = isLive();
  let q = `/api/history?key=${D.key}`;
  if (D.trip != null) q += `&trip=${encodeURIComponent(D.trip)}`;
  if (D.range_s && live) q += `&from=${Date.now() - D.range_s * 1000}`;
  $("d-chart").classList.add("loading");
  try {
    const h = await (await fetch(q)).json();
    D.pts = h.points; D.step = h.step_ms;
    if (D.range_s && !live && D.pts.length) {   // trajet passé : les dernières minutes du trajet
      const end = D.pts[D.pts.length - 1][0];
      D.pts = D.pts.filter((p) => p[0] >= end - D.range_s * 1000);
    }
  } catch (e) {   // pas de base : ce que la page a vu depuis son ouverture
    D.pts = (series[D.key] || []).slice(); D.step = null;
  }
  $("d-chart").classList.remove("loading");
  // Fenêtre de temps : jusqu'à maintenant en direct, sinon jusqu'à la fin du trajet
  const first = D.pts.length ? D.pts[0][0] : Date.now(), lastT = D.pts.length ? D.pts[D.pts.length - 1][0] : Date.now();
  D.x1 = live ? Date.now() : lastT;
  D.x0 = D.range_s ? Math.max(D.x1 - D.range_s * 1000, first) : first;   // trajet plus court que la durée : depuis le début
  if (D.x1 - D.x0 < 10000) D.x0 = D.x1 - 10000;
  const n = D.pts.filter((p) => p[1] != null).length, miss = D.pts.length - n;
  $("d-info").textContent = !D.pts.length ? "Pas encore de mesure sur cette période."
    : `${n} point${n > 1 ? "s" : ""}` + (D.step ? ` · moyenne par tranches de ${duree(D.step)}` : "")
      + (miss ? ` · ${miss} sans réponse du calculateur` : "")
      + (live ? " · mise à jour en direct" : "");
  drawDetail();
}

function drawDetail() {
  if (!dlg.open) return;
  const canvas = $("d-chart"), m = D.m;
  const [ctx, w, h] = setupCanvas(canvas);
  const L = 56, R = 14, T = 10, B = 26, pw = w - L - R, ph = h - T - B;
  const dom = yDomain(D.pts, m) || m.range;
  const pad = (dom[1] - dom[0]) * 0.08;
  const { ticks, lo, hi } = niceTicks(dom[0] - pad, dom[1] + pad);
  const x = (t) => L + ((t - D.x0) / (D.x1 - D.x0)) * pw;
  const y = (v) => T + ph * (1 - (v - lo) / (hi - lo));
  D.geom = { L, pw, x, y };

  // Grille horizontale + valeurs
  ctx.font = "11px system-ui"; ctx.lineWidth = 1;
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (const v of ticks) {
    ctx.strokeStyle = css("--line");
    ctx.beginPath(); ctx.moveTo(L, Math.round(y(v)) + 0.5); ctx.lineTo(w - R, Math.round(y(v)) + 0.5); ctx.stroke();
    ctx.fillStyle = css("--dim");
    ctx.fillText(fmt(v, m.unit), L - 8, y(v));
  }
  ctx.save(); ctx.translate(12, T + ph / 2); ctx.rotate(-Math.PI / 2);
  ctx.textAlign = "center"; ctx.fillText(m.unit, 0, 0); ctx.restore();

  // Heures en bas
  const span = D.x1 - D.x0, step = TIME_STEPS.find((s) => span / s <= 7) || 3600000 * 4;
  const off = new Date().getTimezoneOffset() * 60000;   // graduations calées sur l'heure locale
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  for (let t = Math.ceil((D.x0 - off) / step) * step + off; t <= D.x1; t += step) {
    ctx.fillStyle = css("--dim");
    ctx.fillText(hhmm(t, step < 60000), Math.min(w - R - 20, Math.max(L + 20, x(t))), h - 6);
  }

  // Seuils d'alerte de la métrique, s'ils tombent dans l'échelle
  for (const [thr, col, txt] of [[m.warn, "--hot", "alerte"], [m.cold, "--cold", "froid"]]) {
    if (thr == null || thr < lo || thr > hi) continue;
    ctx.strokeStyle = css(col); ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(L, y(thr)); ctx.lineTo(w - R, y(thr)); ctx.stroke();
    ctx.globalAlpha = 1; ctx.fillStyle = css("--dim"); ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    ctx.fillText(`${txt} ${fmt(thr, m.unit)} ${m.unit}`, L + 6, y(thr) - 3);
  }

  // Courbe : voile de 10 % sous la ligne, ligne de 2 px ; coupée sur les trous
  const gap = Math.max(5000, (D.step || 0) * 3);
  ctx.save();
  ctx.beginPath(); ctx.rect(L, T, pw, ph); ctx.clip();
  const accent = css("--accent");
  ctx.fillStyle = accent; ctx.globalAlpha = 0.1;
  let run = [];
  const flush = () => {
    if (run.length > 1) {
      ctx.beginPath(); ctx.moveTo(x(run[0][0]), T + ph);
      for (const [t, v] of run) ctx.lineTo(x(t), y(v));
      ctx.lineTo(x(run[run.length - 1][0]), T + ph); ctx.fill();
    }
    run = [];
  };
  for (const p of D.pts) {
    if (p[1] == null || (run.length && p[0] - run[run.length - 1][0] > gap)) flush();
    if (p[1] != null) run.push(p);
  }
  flush();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.lineJoin = ctx.lineCap = "round";
  tracePath(ctx, D.pts, x, y, gap);
  ctx.stroke();
  ctx.restore();

  // Point à marquer : celui sous le curseur, sinon la dernière valeur en direct
  const lastPt = [...D.pts].reverse().find((p) => p[1] != null);
  const mark = D.hover || (isLive() ? lastPt : null);
  if (D.hover) {
    ctx.strokeStyle = css("--dim"); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(Math.round(x(D.hover[0])) + 0.5, T); ctx.lineTo(Math.round(x(D.hover[0])) + 0.5, T + ph); ctx.stroke();
  }
  if (mark && mark[1] != null) {
    ctx.beginPath(); ctx.arc(x(mark[0]), y(mark[1]), 4, 0, Math.PI * 2);
    ctx.fillStyle = accent; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = css("--panel"); ctx.stroke();
  }
}

// Curseur : la ligne verticale suit la souris et s'accroche au point le plus proche dans le temps
function hoverAt(clientX) {
  const g = D.geom, r = $("d-chart").getBoundingClientRect();
  if (!g || !D.pts.length) return;
  const t = D.x0 + ((clientX - r.left - g.L) / g.pw) * (D.x1 - D.x0);
  let a = 0, b = D.pts.length - 1;
  while (b - a > 1) { const mid = (a + b) >> 1; D.pts[mid][0] < t ? (a = mid) : (b = mid); }
  const p = Math.abs(D.pts[a][0] - t) < Math.abs(D.pts[b][0] - t) ? D.pts[a] : D.pts[b];
  D.hover = p;
  const tip = $("d-tip");
  tip.querySelector("b").textContent = p[1] == null ? "pas de réponse" : `${fmt(p[1], D.m.unit)} ${D.m.unit}`;
  tip.querySelector("span").textContent = hhmm(p[0], true) + (D.step ? ` (moyenne ${duree(D.step)})` : "");
  tip.style.display = "block";
  const px = g.x(p[0]), left = px + 12 + tip.offsetWidth > r.width ? px - 12 - tip.offsetWidth : px + 12;
  tip.style.left = `${left}px`;
  tip.style.top = `${p[1] == null ? 10 : Math.max(0, g.y(p[1]) - tip.offsetHeight - 10)}px`;
  drawDetail();
}
function hoverOff() { D.hover = null; $("d-tip").style.display = "none"; drawDetail(); }
$("d-chart").addEventListener("pointermove", (e) => hoverAt(e.clientX));
$("d-chart").addEventListener("pointerdown", (e) => hoverAt(e.clientX));
$("d-chart").addEventListener("pointerleave", hoverOff);

function showDetailValue() {
  if (!dlg.open || !last) return;
  const u = document.createElement("small");
  if (isLive()) {
    u.textContent = D.m.unit;
    $("d-now").replaceChildren(document.createTextNode(fmt(last.values[D.key], D.m.unit)), u);
  } else {
    u.textContent = "trajet passé : survole la courbe pour lire les valeurs";
    u.style.marginLeft = 0;
    $("d-now").replaceChildren(u);
  }
}

async function openDetail(key, trip = null) {
  D.key = key; D.m = meta.metrics.find((m) => m.key === key); D.hover = null; D.trip = trip;
  $("d-title").textContent = D.m.label;
  for (const b of $("d-range").children) b.classList.toggle("on", +b.dataset.s === D.range_s);
  dlg.showModal();
  showDetailValue();
  await loadTrips();
  await loadDetail();
  clearInterval(D.timer);
  D.timer = setInterval(() => { showDetailValue(); if (isLive()) loadDetail(); }, 1000);
}
for (const b of $("d-range").children) {
  b.onclick = () => {
    D.range_s = +b.dataset.s;
    for (const o of $("d-range").children) o.classList.toggle("on", o === b);
    hoverOff();
    loadDetail();
  };
}
$("d-trip").onchange = (e) => { D.trip = e.target.value; hoverOff(); showDetailValue(); loadDetail(); };
$("d-close").onclick = () => dlg.close();
dlg.addEventListener("click", (e) => {   // clic à côté de la fenêtre (sur le fond assombri)
  const r = dlg.getBoundingClientRect();
  if (e.target === dlg && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) dlg.close();
});
dlg.addEventListener("close", () => { clearInterval(D.timer); hoverOff(); });
addEventListener("resize", drawDetail);

// ---------- Onglets ----------
let tripsTimer = null;
function showTab(name) {
  for (const t of ["dash", "trips", "set"]) {
    $("view-" + t).hidden = t !== name;
    $("tab-" + t).classList.toggle("on", t === name);
  }
  clearInterval(tripsTimer);
  if (name === "set") loadServerSettings();
  if (name === "trips") { renderTrips(); tripsTimer = setInterval(renderTrips, 10000); }
}
$("tab-dash").onclick = () => showTab("dash");
$("tab-trips").onclick = () => showTab("trips");
$("tab-set").onclick = () => showTab("set");

// ---------- Trajets ----------
const fmtKm = (km) => `${(km ?? 0).toLocaleString("fr-FR", { maximumFractionDigits: 1 })} km`;
const num = (v, d = 0) => v == null ? "—" : v.toLocaleString("fr-FR", { maximumFractionDigits: d });

function tripCard(t) {
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const live = t.id === last?.trip;
  const card = el("article", "trip" + (live ? " live" : "") + (t.kind === "arret" ? " idle" : ""));

  const head = el("div", "t-head");
  head.append(el("b", null, t.name));
  if (live) head.append(el("span", "badge live", "en cours"));
  if (t.kind === "arret") head.append(el("span", "badge", "moteur allumé sans rouler"));
  card.append(head);

  const facts = el("div", "t-facts");
  const parts = [`${hhmm(t.start_ms)} → ${live ? "…" : hhmm(t.end_ms)}`, duree(t.end_ms - t.start_ms)];
  if (t.kind === "trajet") parts.push(fmtKm(t.distance_km));
  if (t.coolant_start != null)
    parts.push(`démarrage ${t.cold_start ? "à froid" : "à chaud"} (eau ${num(t.coolant_start)} °C)`);
  if (t.engine_stops) parts.push(`${t.engine_stops} arrêt${t.engine_stops > 1 ? "s" : ""} moteur`);
  facts.textContent = parts.join(" · ");
  card.append(facts);

  card.append(el("div", "t-max", "max : " + [
    `${num(t.max_rpm)} tr/min`, `${num(t.max_speed)} km/h`, `eau ${num(t.max_coolant)} °C`,
    `turbo ${num(t.max_boost, 2)} bar`,
  ].join(" · ") + (t.missing_ratio ? ` · ${num(t.missing_ratio * 100, 1)} % sans réponse` : "")));

  if (t.alerts.length) {
    const ul = el("ul", "t-alerts");
    for (const a of t.alerts) ul.append(el("li", null, `${hhmm(a.t_ms, true)} · ${a.detail} (${num(a.value, 1)})`));
    card.append(ul);
  }

  const act = el("div", "t-actions");
  const note = el("input", "t-note");
  note.value = t.note || ""; note.placeholder = "Note (ex. Rennes → Nantes, chargé)"; note.maxLength = 500;
  note.setAttribute("aria-label", `Note du ${t.name}`);
  const saved = el("span", "t-saved", "enregistré");
  note.onchange = async () => {
    try {
      await fetch("/api/trips/note", { method: "POST", body: JSON.stringify({ id: t.id, note: note.value }) });
      saved.style.opacity = 1; setTimeout(() => (saved.style.opacity = 0), 1200);
    } catch (e) {}
  };
  note.onkeydown = (e) => { if (e.key === "Enter") note.blur(); };
  act.append(note, saved);
  const key = ["speed", "rpm"].find((k) => meta?.metrics.some((m) => m.key === k));
  if (key) {
    const b = el("button", null, "Voir les courbes");
    b.onclick = () => { D.range_s = 0; openDetail(key, t.id); };
    act.append(b);
  }
  card.append(act);
  return card;
}

async function renderTrips() {
  const box = $("trips");
  if (box.contains(document.activeElement)) return;   // note en cours de saisie : on ne redessine pas
  let trips;
  try {
    const r = await fetch("/api/trips");
    if (!r.ok) throw new Error();
    trips = await r.json();
  } catch (e) {
    box.replaceChildren(Object.assign(document.createElement("p"), { className: "empty", textContent: "Enregistrement désactivé (--no-db)." }));
    return;
  }
  box.replaceChildren(...(trips.length ? trips.map(tripCard)
    : [Object.assign(document.createElement("p"), { className: "empty",
        textContent: "Pas encore de trajet. Un trajet commence au démarrage du moteur." })]));
}

// ---------- Paramètres ----------
let pollTimer = null;
function restartPoll() { clearInterval(pollTimer); pollTimer = setInterval(poll, ui.poll_ms); }

const UI_FIELDS = {
  poll:  { key: "poll_ms",   show: (v) => `${v} ms` },
  hist:  { key: "history_s", show: (v) => `${v} s` },
};
function syncUi() {
  for (const [id, f] of Object.entries(UI_FIELDS)) {
    $("s-" + id).value = ui[f.key];
    $("o-" + id).textContent = f.show(ui[f.key]);
  }
}
for (const [id, f] of Object.entries(UI_FIELDS)) {
  $("s-" + id).oninput = (e) => {
    ui[f.key] = Number(e.target.value);
    $("o-" + id).textContent = f.show(ui[f.key]);
    saveUi();
    if (f.key === "poll_ms") restartPoll();
  };
}
$("s-default").onclick = () => { Object.assign(ui, DEFAULTS); saveUi(); syncUi(); restartPoll(); };

const SERVER_FIELDS = {
  max_hz: (v) => `${v} Hz`,
  delay:  (v) => `${Math.round(v * 1000)} ms`,
  log_hz: (v) => `${v} Hz`,
};
function showServer(st) {
  if (st.fast !== undefined) {
    $("s-fast").checked = st.fast;
    $("o-fast").textContent = st.fast ? "activé" : "désactivé";
  }
  for (const [k, show] of Object.entries(SERVER_FIELDS)) {
    if (st[k] === undefined) continue;
    $("s-" + k).value = st[k];
    $("o-" + k).textContent = show(st[k]);
  }
}
async function sendServer(change) {
  try {
    const r = await fetch("/api/settings", { method: "POST", body: JSON.stringify(change) });
    showServer(await r.json());
    $("saved").style.opacity = 1;
    setTimeout(() => ($("saved").style.opacity = 0), 1200);
  } catch (err) {}
}
async function loadServerSettings() {
  try { showServer(await (await fetch("/api/settings")).json()); } catch (e) {}
}
const sendTimers = {};
for (const [k, show] of Object.entries(SERVER_FIELDS)) {
  $("s-" + k).oninput = (e) => {
    $("o-" + k).textContent = show(Number(e.target.value));
    clearTimeout(sendTimers[k]);
    sendTimers[k] = setTimeout(() => sendServer({ [k]: Number(e.target.value) }), 250);
  };
}
$("s-fast").onchange = (e) => sendServer({ fast: e.target.checked });

syncUi();
restartPoll();
poll();
requestAnimationFrame(frame);
</script>
</body>
</html>
